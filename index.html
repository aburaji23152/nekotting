<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこっちんぐ</title>

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ねこっちんぐ">
    <link rel="apple-touch-icon" href="./cat_img/kijitora.png">

    <!-- Leaflet.js (地図ライブラリ) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.heat (ヒートマッププラグイン) -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- MarkerCluster (重なり防止プラグイン) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Turf.js (空間解析・地理計算ライブラリ) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- TensorFlow.js & Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!-- カスタムCSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🐾 ねこっちんぐ</h1>
    </header>

    <nav>
        <div class="nav-wrapper">
            <button id="tab-map" class="tab-btn active">🗺️ 地図</button>
            <button id="tab-camera" class="tab-btn">📷 撮影</button>
            <button id="tab-book" class="tab-btn">📖 図鑑</button>
            <button id="tab-analysis" class="tab-btn">📊 分析</button>
            <button id="tab-history" class="tab-btn">📋 履歴</button>
        </div>
    </nav>

    <main>
        <div id="map-container" class="page-content active">
            <div id="map"></div>
        </div>

        <div id="camera-container" class="page-content">
            <div class="camera-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <img src="./frame.png" class="camera-frame" alt="カメラフレーム">
            </div>
            <button id="snap-btn">📸 撮影して登録</button>
            <div id="ai-status">⚙️ AI準備中...</div>
            <canvas id="capture-canvas" style="display: none;"></canvas>
        </div>

        <div id="book-container" class="page-content">
            <div class="section-title">📖 にゃんこ図鑑コレクション</div>
            
            <div class="comp-card">
                <div class="comp-header">
                    <span>コンプリート率</span>
                    <span id="comp-text">0 / 10 種類 (0%)</span>
                </div>
                <div class="comp-progress-track">
                    <div id="comp-bar" class="comp-progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="section-title" style="font-size: 0.85rem; margin-bottom: 8px;">🎖️ 獲得実績バッジ</div>
            <div class="badge-grid" id="badge-container"></div>

            <div class="section-title" style="font-size: 0.85rem; margin-bottom: 8px;">🐈 登録されている猫一覧</div>
            <div class="book-grid" id="book-grid-view"></div>
        </div>

        <div id="analysis-container" class="page-content">
            <div class="section-title">📊 にゃんこタイムライン（行動パターン分析）</div>
            
            <div class="insight-box">
                <div class="insight-title">💡 観察データからの自動インサイト</div>
                <div id="insight-text-content" class="insight-text">データ蓄積中...</div>
            </div>

            <div class="analysis-card">
                <div style="font-weight: 700; font-size: 0.9rem;">⏰ 時間帯別アクティビティ</div>
                <div class="bar-group">
                    <div class="bar-item">
                        <div class="bar-label"><span>🌅 朝 (5:00 - 9:59)</span><span id="cnt-morning">0件 (0%)</span></div>
                        <div class="bar-track"><div id="bar-morning" class="bar-fill fill-morning" style="width: 0%;"></div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span>☀️ 昼 (10:00 - 15:59)</span><span id="cnt-noon">0件 (0%)</span></div>
                        <div class="bar-track"><div id="bar-noon" class="bar-fill fill-noon" style="width: 0%;"></div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span>🌆 夕 (16:00 - 18:59)</span><span id="cnt-evening">0件 (0%)</span></div>
                        <div class="bar-track"><div id="bar-evening" class="bar-fill fill-evening" style="width: 0%;"></div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span>🌙 夜 (19:00 - 4:59)</span><span id="cnt-night">0件 (0%)</span></div>
                        <div class="bar-track"><div id="bar-night" class="bar-fill fill-night" style="width: 0%;"></div></div>
                    </div>
                </div>
            </div>

            <div class="analysis-card">
                <div style="font-weight: 700; font-size: 0.9rem;">📅 曜日別発見分布</div>
                <div class="weekday-grid" id="weekday-grid-view">
                    <!-- JSで動的生成 -->
                </div>
            </div>
        </div>

        <div id="history-container" class="page-content">
            <div class="section-title">📋 撮影・発見履歴</div>
            <div id="history-list-view" class="history-list"></div>
        </div>
    </main>

    <!-- カスタムJavaScript -->
    <script src="script.js"></script>
</body>
</html>
